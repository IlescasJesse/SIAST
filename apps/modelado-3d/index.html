<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIAST — Edificio Saúl Martínez</title>
    <style>
      /* ═══════════════════════════════════════════════════════
         VARIABLES DE TEMA — toda la UI de overlay las usa.
         El JS alterna data-theme="dark" en <html>.
         ─────────────────────────────────────────────────────
         Paleta institucional:
           --color-primary   guinda #9d2449   (acento principal)
           --color-secondary azul  #1e5fa8    (info secundaria)
         ═══════════════════════════════════════════════════════ */
      :root {
        /* Superficies */
        --bg-overlay:       rgba(255, 255, 255, 0.88);
        --bg-overlay-hover: rgba(255, 255, 255, 0.96);
        --bg-tab-active:    #9d2449;
        --bg-loader:        #f5f4f2;

        /* Bordes */
        --border-subtle:    rgba(100, 150, 210, 0.30);
        --border-panel:     rgba(100, 150, 210, 0.35);

        /* Texto */
        --text-primary:     #1a2744;
        --text-secondary:   #5a6a80;
        --text-muted:       #718096;
        --text-tab:         #2b6cb0;
        --text-tab-active:  #ffffff;
        --text-badge:       #1a2744;

        /* Institucionales */
        --color-primary:    #9d2449;
        --color-secondary:  #1e5fa8;

        /* Sombras */
        --shadow-panel:     0 4px 20px rgba(0, 0, 0, 0.10);
        --shadow-bar:       0 2px 16px rgba(0, 0, 0, 0.12);

        /* Loader */
        --loader-bar-bg:    rgba(0, 0, 0, 0.08);

        /* Badges secundarios */
        --badge-bg:         rgba(255, 255, 255, 0.80);
        --badge-border:     rgba(100, 150, 210, 0.30);

        /* Área deshabilitada en tab bar */
        --tab-disabled-color:   rgba(100, 130, 170, 0.45);
        --tab-disabled-border:  rgba(100, 130, 170, 0.20);

        /* Tickets */
        --ticket-bg:        rgba(220, 38, 38, 0.08);
        --ticket-border:    rgba(220, 38, 38, 0.25);
        --ticket-text:      #c53030;
      }

      [data-theme="dark"] {
        /* Superficies */
        --bg-overlay:       rgba(15, 22, 40, 0.88);
        --bg-overlay-hover: rgba(20, 30, 55, 0.96);
        --bg-tab-active:    #9d2449;
        --bg-loader:        #070b14;

        /* Bordes */
        --border-subtle:    rgba(80, 110, 160, 0.35);
        --border-panel:     rgba(80, 120, 180, 0.30);

        /* Texto */
        --text-primary:     #e2eaf8;
        --text-secondary:   #8da4c4;
        --text-muted:       #6b82a0;
        --text-tab:         #7fa8d8;
        --text-tab-active:  #ffffff;
        --text-badge:       #c8d8f0;

        /* Institucionales — igual en ambos temas */
        --color-primary:    #9d2449;
        --color-secondary:  #4a8fd4;

        /* Sombras */
        --shadow-panel:     0 4px 24px rgba(0, 0, 0, 0.45);
        --shadow-bar:       0 2px 20px rgba(0, 0, 0, 0.50);

        /* Loader */
        --loader-bar-bg:    rgba(255, 255, 255, 0.08);

        /* Badges */
        --badge-bg:         rgba(15, 22, 40, 0.80);
        --badge-border:     rgba(80, 110, 160, 0.35);

        /* Área deshabilitada */
        --tab-disabled-color:   rgba(100, 130, 160, 0.35);
        --tab-disabled-border:  rgba(80, 110, 140, 0.20);

        /* Tickets */
        --ticket-bg:        rgba(220, 38, 38, 0.12);
        --ticket-border:    rgba(220, 38, 38, 0.30);
        --ticket-text:      #f47070;
      }

      /* ── Reset base ── */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: var(--bg-loader);
        color: var(--text-primary);
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      #canvas-container {
        position: fixed;
        inset: 0;
      }

      canvas { display: block; }

      /* ═══════════════════════════════════════════════════════
         PANEL DE INFORMACIÓN DE ÁREA (arriba-derecha)
         ═══════════════════════════════════════════════════════ */
      #info-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 260px;
        background: var(--bg-overlay);
        border: 1px solid var(--border-panel);
        border-radius: 12px;
        padding: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--shadow-panel);
        transition: opacity 0.3s, background 0.25s, border-color 0.25s;
        opacity: 0;
        pointer-events: none;
        z-index: 20;
      }

      #info-panel.visible { opacity: 1; pointer-events: auto; }

      /* Franja de acento guinda arriba del panel */
      #info-panel::before {
        content: '';
        display: block;
        height: 3px;
        background: linear-gradient(90deg, var(--color-primary), transparent);
        border-radius: 3px 3px 0 0;
        margin: -16px -16px 12px;
      }

      #info-panel h3 {
        font-size: 13px;
        font-weight: 700;
        color: var(--color-primary);
        margin-bottom: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      #info-panel .field {
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      #info-panel .field span {
        color: var(--text-primary);
        font-weight: 500;
      }

      #info-panel .tickets-count {
        margin-top: 10px;
        padding: 7px 10px;
        border-radius: 7px;
        background: var(--ticket-bg);
        border: 1px solid var(--ticket-border);
        font-size: 12px;
        color: var(--ticket-text);
        display: none;
      }

      #info-panel .tickets-count.visible { display: block; }

      /* ═══════════════════════════════════════════════════════
         BADGE DE NIVEL — arriba-centro, debajo del borde superior
         Muestra: "Edificio completo" / "Planta Baja" / "Sala de Servidores — PB"
         ═══════════════════════════════════════════════════════ */
      #level-badge {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--badge-bg);
        border: 1px solid var(--badge-border);
        border-radius: 20px;
        padding: 5px 16px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 12px;
        font-weight: 600;
        color: var(--text-badge);
        letter-spacing: 0.04em;
        box-shadow: var(--shadow-bar);
        white-space: nowrap;
        transition: background 0.25s, border-color 0.25s, color 0.25s;
        z-index: 20;
        /* Punto de color institucional */
        display: flex;
        align-items: center;
        gap: 7px;
      }

      #level-badge .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-primary);
        flex-shrink: 0;
      }

      /* floor-controls y theme-toggle eliminados — navegación de pisos
         ahora vive en la barra superior de React (apps/web). */

      /* ═══════════════════════════════════════════════════════
         LOADER
         ═══════════════════════════════════════════════════════ */
      #loader {
        position: fixed;
        inset: 0;
        background: var(--bg-loader);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        transition: opacity 0.6s, background 0.25s;
      }

      #loader.hidden { opacity: 0; pointer-events: none; }

      #loader .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--color-primary);
        margin-bottom: 8px;
      }

      #loader .sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 32px;
      }

      #loader .bar-wrap {
        width: 200px;
        height: 3px;
        background: var(--loader-bar-bg);
        border-radius: 3px;
        overflow: hidden;
      }

      #loader .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #9d2449, #c44e71);
        border-radius: 3px;
        transition: width 0.4s ease;
      }

      /* ═══════════════════════════════════════════════════════
         LOGIN OVERLAY
         ═══════════════════════════════════════════════════════ */
      #login-overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        pointer-events: none;
      }

      #login-overlay.visible { display: flex; }

      #login-overlay .title {
        font-size: 28px;
        font-weight: 700;
        color: var(--color-primary);
        letter-spacing: 0.08em;
        text-shadow: 0 0 30px rgba(157, 36, 73, 0.3);
        margin-bottom: 4px;
      }

      #login-overlay .subtitle {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- ── Loader de entrada ── -->
    <div id="loader">
      <div class="logo">SIAST</div>
      <div class="sub">Edificio Saúl Martínez — Secretaría de Finanzas</div>
      <div class="bar-wrap"><div class="bar" id="loader-bar"></div></div>
    </div>

    <!-- ── Canvas Three.js ── -->
    <div id="canvas-container"></div>

    <!-- ── Badge de nivel (arriba-centro) ── -->
    <div id="level-badge">
      <span class="badge-dot"></span>
      <span id="level-badge-text">Edificio completo</span>
    </div>

    <!-- ── Panel de información de área (arriba-derecha) ── -->
    <div id="info-panel">
      <h3 id="panel-area-name">Área</h3>
      <div class="field">Piso: <span id="panel-floor">—</span></div>
      <div class="field">ID: <span id="panel-id">—</span></div>
      <div class="field">Cuadrícula: <span id="panel-grid">—</span></div>
      <div class="tickets-count" id="panel-tickets"></div>
    </div>

    <!-- ── Overlay de modo login ── -->
    <div id="login-overlay">
      <div class="title">SIAST</div>
      <div class="subtitle">Sistema Integral de Atención y Soporte Técnico</div>
    </div>

    <script type="module" src="/src/main.js"></script>

    <script>
      /* ═══════════════════════════════════════════════════════
         BADGE DE NIVEL — sincronizado con siast:viewchange
         despacha main.js cada vez que cambia viewLevel.
         Payload: { detail: { level, floor, areaLabel } }
         ═══════════════════════════════════════════════════════ */
      const FLOOR_LABELS_UI = { 0: "Planta Baja", 1: "Nivel 1", 2: "Nivel 2", 3: "Nivel 3" };

      window.addEventListener("siast:viewchange", function (e) {
        const { level, floor, areaLabel } = e.detail ?? {};
        const badgeText = document.getElementById("level-badge-text");
        if (!badgeText) return;

        if (level === "building") {
          badgeText.textContent = "Edificio completo";
        } else if (level === "floor") {
          badgeText.textContent = FLOOR_LABELS_UI[floor] ?? `Piso ${floor}`;
        } else if (level === "area") {
          const floorStr = FLOOR_LABELS_UI[floor] ?? `Piso ${floor}`;
          badgeText.textContent = areaLabel ? `${areaLabel} — ${floorStr}` : floorStr;
        }
      });

      /* _siast3dApplyTheme queda como stub para no romper código externo
         que ya enviara SET_THEME vía postMessage. El visor es siempre claro;
         la llamada es inocua (solo actualiza data-theme en el DOM). */
      window._siast3dApplyTheme = function (theme) {
        document.documentElement.setAttribute("data-theme", "light");
        if (window.SIAST3D && typeof window.SIAST3D.setTheme === "function") {
          window.SIAST3D.setTheme("light");
        }
      };
    </script>
  </body>
</html>
